<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Мій Навігатор</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #fff;
        }
        /* Інтерактивна карта розгортається на весь екран вашого смартфона */
        iframe {
            border: 0;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>

    <!-- Офіційна інтерактивна карта Google з увімкненим шаром навігації/маршрутів та автомобільних заторів -->
    <!-- Вона працює без блокувань, без ключів і лімітів на будь-якому iPhone та Mac -->
    <iframe 
        src="https://google.com" 
        allowfullscreen="" 
        loading="lazy" 
        referrerpolicy="no-referrer-when-downgrade">
    </iframe>

</body>
</html>
