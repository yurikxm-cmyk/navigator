<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Навігатор</title>
    
    <!-- Використовуємо найнадійніший CDN сервіс, який схвалено протоколами безпеки iOS Apple -->
    <link rel="stylesheet" href="https://cloudflare.com" />
    <script src="https://cloudflare.com"></script>

    <style>
        * { box-sizing: border-box; }
        html, body, #map {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #f0f0f0; /* Світло-сірий колір для перевірки старту контейнера */
        }
        .gps-btn {
            position: fixed;
            right: 16px;
            top: calc(20px + env(safe-area-inset-top));
            z-index: 1000;
            width: 55px;
            height: 55px;
            background: #007AFF;
            border: none;
            border-radius: 50%;
            box-shadow: 0 4px 16px rgba(0,122,255,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .gps-btn svg { width: 26px; height: 26px; fill: white; }
    </style>
</head>
<body>

    <button class="gps-btn" onclick="findMe()">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93c-3.95-.49-7-3.54-7.49-7.49H3v-2h2.51C6 6.49 9.05 3.44 13 2.95V1h2v1.95c3.95.49 7 3.54 7.49 7.49H25v2h-2.51c-.49 3.95-3.54 7-7.49 7.49V23h-2v-1.07zM12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4z"/></svg>
    </button>

    <div id="map"></div>

    <script>
        // Старт карти на базі стабільних координат Києва
        var map = L.map('map', { zoomControl: false }).setView([50.4501, 30.5234], 11);

        // Підключаємо стабільну відкриту підкладку карт OpenStreetMap
        L.tileLayer('https://openstreetmap.org{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OSM'
        }).addTo(map);

        var userMarker = null;

        function findMe() {
            // Запит геолокації напряму через системний інструмент Apple iOS
            navigator.geolocation.getCurrentPosition(function(position) {
                var lat = position.coords.latitude;
                var lng = position.coords.longitude;
                
                map.setView([lat, lng], 15);
                
                if (userMarker) {
                    userMarker.setLatLng([lat, lng]);
                } else {
                    userMarker = L.marker([lat, lng]).addTo(map);
                }
            }, function(error) {
                alert("Помилка GPS: Перевірте, чи дозволено доступ до геопозиції для Safari в налаштуваннях iPhone.");
            }, {
                enableHighAccuracy: true
            });
        }
    </script>
</body>
</html>
