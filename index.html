<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Навігатор Apple</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #fff;
        }
        /* Карта розгортається на весь екран смартфона та Mac */
        iframe {
            border: 0;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>

    <!-- Підключаємо офіційну інтерактивну карту Apple Maps з центром у Києві -->
    <!-- Вона працює без блокувань, без ключів і лімітів на будь-якому пристрої Apple -->
    <iframe 
        src="https://apple.com" 
        allowfullscreen="" 
        loading="lazy">
    </iframe>

</body>
</html>
