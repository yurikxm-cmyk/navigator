<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Мій Навігатор</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111; /* Стильний темний фон */
        }
        /* Велика красива кнопка в стилі Apple */
        .nav-btn {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 18px;
            font-weight: 600;
            color: #white;
            background: #007AFF;
            border: none;
            border-radius: 14px;
            padding: 16px 32px;
            box-shadow: 0 8px 24px rgba(0,122,255,0.4);
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.2s;
        }
        .nav-btn:active {
            background: #0056b3;
        }
        .nav-btn svg {
            width: 20px;
            height: 20px;
            fill: white;
        }
    </style>
</head>
<body>

    <!-- Кнопка, яка напряму викликає системну навігацію до вказаних координат -->
    <!-- За замовчуванням стоять координати центру Києва (50.4501, 30.5234). Ви можете змінити їх на будь-які інші! -->
    <a href="maps://?daddr=50.4501,30.5234&saddr=Current+Location" class="nav-btn">
        <svg viewBox="0 0 24 24"><path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"/></svg>
        Запустити Навігацію
    </a>

</body>
</html>
