<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Навігатор Візіком</title>
    <link rel="stylesheet" href="https://cloudflare.com" />
    <link rel="stylesheet" href="https://cloudflare.com" />
    <style>
        html, body, #map { margin: 0; padding: 0; width: 100%; height: 100%; background: #111; }
        body { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
        .leaflet-routing-container {
            background: rgba(255, 255, 255, 0.9) !important;
            backdrop-filter: blur(20px) !important;
            -webkit-backdrop-filter: blur(20px) !important;
            border-radius: 20px !important;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15) !important;
            max-width: 340px !important;
            width: calc(100% - 32px) !important;
            margin: 16px auto !important;
            position: fixed !important;
            bottom: env(safe-area-inset-bottom);
            left: 16px; right: 16px; z-index: 1000; max-height: 180px; overflow-y: auto;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="https://cloudflare.com"></script>
    <script src="https://cloudflare.com"></script>
    <script>
        const VISICOM_API_KEY = "02fc3ee7ec46e16101e5c94f03564615"; 
        var map = L.map('map', { zoomControl: false }).setView([50.4501, 30.5234], 12);

        // Перевірене посилання на тайли Візіком
        var visicomUrl = 'https://visicom.ua{z}/{x}/{-y}.png?key=' + VISICOM_API_KEY;
        L.tileLayer(visicomUrl, { attribution: '© Візіком', maxZoom: 19, tms: true }).addTo(map);

        var routingControl = L.Routing.control({
            waypoints: [L.latLng(50.4501, 30.5234), L.latLng(50.4600, 30.5300)],
            router: L.Routing.osrmv1({ serviceUrl: 'https://project-osrm.org', profile: 'driving' }),
            routeWhileDragging: true, language: 'uk',
            lineOptions: { styles: [{ color: '#007AFF', opacity: 0.8, weight: 6 }] }
        }).addTo(map);

        setTimeout(function() { map.invalidateSize(); }, 300);
    </script>
</body>
</html>
